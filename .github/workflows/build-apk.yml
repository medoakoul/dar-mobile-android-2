name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Prepare project
        run: |
          mkdir -p android-project
          unzip -q dar-mobile-android-project-v1.0.1-login-modal.zip -d android-project
          mkdir -p android-project/app/src/main/assets/js
          cp app.js android-project/app/src/main/assets/js/app.js
          cp index.html android-project/app/src/main/assets/index.html
          cp data.js android-project/app/src/main/assets/js/data.js
          sed -i "s/versionCode [0-9]*/versionCode 16/; s/versionName '[^']*'/versionName '1.2.0'/" android-project/app/build.gradle

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dar-mobile-database-v1.2.0-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
